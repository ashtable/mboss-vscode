name: CI
on: [pull_request]
jobs:
  test:
    # Packaging from Windows drops the POSIX
    # executable bit from everything in the archive,
    # so the job that produces one stays off it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The nested source is imported at typecheck
          # and test time through path aliases, and
          # part of it ships as an asset.
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # The MCP server a new project is given is
      # built in its own repository and shipped here
      # as bytes — its dist/ is not tracked, so a
      # checkout carries the source and not the
      # bundle. Everything downstream that builds
      # this extension needs it already there.
      - run: npm run build:mcp
      - run: npm run lint
      # The suite builds the extension and packages a
      # VSIX of its own, because what it has to say
      # about either is only true of the real thing.
      - run: npm test
      # The webviews are React and a graph library,
      # which measure the DOM and work in pointer
      # events. Nothing about drawing a wire is true
      # under a simulated browser, so these run in a
      # real one — against the built bundles, with no
      # VS Code and no server.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webview

      # Then the build again on its own. A build that
      # has only ever run from inside a test is a
      # build nobody has checked can run without one —
      # and this is the step that leaves the artifact
      # somewhere a person can pick it up.
      - run: npm run package

      - name: Upload the extension
        uses: actions/upload-artifact@v7
        with:
          name: mboss-vscode
          path: '*.vsix'
